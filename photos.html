<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'; require-trusted-types-for 'script'; trusted-types 'none'; upgrade-insecure-requests">
<meta name="referrer" content="no-referrer">
<title>Фотогалерея — EgorNetwork</title>
<meta name="description" content="Кадры с проектов EgorNetwork и творчество комьюнити.">
<meta name="theme-color" content="#07080b">
<link rel="icon" href="assets/img/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/site.css">
<script src="assets/js/site.js"></script>
<script src="assets/js/photos.js" defer></script>
</head>
<body>
<header class="site-header" id="site-header"></header>

<main id="main" class="wrap">
  <section class="page-head">
    <span class="eyebrow reveal">Галерея</span>
    <h1 class="reveal d-1">Фото и кадры</h1>
    <p class="lead reveal d-2">Скриншоты с плейтестов, история студии и фоточки от нашего комьюнити.</p>
  </section>
  <div class="gallery" id="gallery" data-stagger>
    <figure class="shot">
      <button type="button" aria-label="Открыть: Первый плейтест «Катакомб» — кадр 1"><img src="assets/img/gallery/playtest-1.webp" alt="Первый плейтест «Катакомб» — кадр 1" width="885" height="467" loading="lazy" decoding="async"></button>
      <figcaption>Первый плейтест «Катакомб» — кадр 1</figcaption>
    </figure>
    <figure class="shot">
      <button type="button" aria-label="Открыть: Первый плейтест «Катакомб» — кадр 2"><img src="assets/img/gallery/playtest-2.webp" alt="Первый плейтест «Катакомб» — кадр 2" width="885" height="497" loading="lazy" decoding="async"></button>
      <figcaption>Первый плейтест «Катакомб» — кадр 2</figcaption>
    </figure>
    <figure class="shot">
      <button type="button" aria-label="Открыть: Главное меню «Катакомб», когда они только родились в голове"><img src="assets/img/gallery/catacombs-old-menu.webp" alt="Главное меню «Катакомб», когда они только родились в голове" width="1280" height="719" loading="lazy" decoding="async"></button>
      <figcaption>Главное меню «Катакомб», когда они только родились в голове</figcaption>
    </figure>
    <figure class="shot">
      <button type="button" aria-label="Открыть: Самый первый сайт. Press F (2024–2026)"><img src="assets/img/gallery/old-site.webp" alt="Самый первый сайт. Press F (2024–2026)" width="1280" height="606" loading="lazy" decoding="async"></button>
      <figcaption>Самый первый сайт. Press F (2024–2026)</figcaption>
    </figure>
    <figure class="shot">
      <button type="button" aria-label="Открыть: Логотип EgorNetwork в 4K 😮"><img src="assets/img/gallery/logo.webp" alt="Логотип EgorNetwork в 4K 😮" width="1920" height="1080" loading="lazy" decoding="async"></button>
      <figcaption>Логотип EgorNetwork в 4K 😮</figcaption>
    </figure>
    <figure class="shot">
      <button type="button" aria-label="Открыть: Жёсткая пикча от Роцка"><img src="assets/img/gallery/rozk.webp" alt="Жёсткая пикча от Роцка" width="622" height="89" loading="lazy" decoding="async"></button>
      <figcaption>Жёсткая пикча от Роцка</figcaption>
    </figure>
    <figure class="shot">
      <button type="button" aria-label="Открыть: Пэс от Геймса"><img src="assets/img/gallery/dog.webp" alt="Пэс от Геймса" width="570" height="546" loading="lazy" decoding="async"></button>
      <figcaption>Пэс от Геймса</figcaption>
    </figure>
    <figure class="shot">
      <button type="button" aria-label="Открыть: Вихрь завёз"><img src="assets/img/gallery/zavos.webp" alt="Вихрь завёз" width="735" height="714" loading="lazy" decoding="async"></button>
      <figcaption>Вихрь завёз</figcaption>
    </figure>
    <figure class="shot">
      <button type="button" aria-label="Открыть: Отзыв Геймса о модерации Discord-сервера"><img src="assets/img/gallery/moderation.gif" alt="Отзыв Геймса о модерации Discord-сервера" width="480" height="388" loading="lazy" decoding="async"></button>
      <figcaption>Отзыв Геймса о модерации Discord-сервера</figcaption>
    </figure>
    <figure class="shot">
      <button type="button" aria-label="Открыть: Вихрь сознался"><img src="assets/img/gallery/pixr.webp" alt="Вихрь сознался" width="736" height="736" loading="lazy" decoding="async"></button>
      <figcaption>Вихрь сознался</figcaption>
    </figure>
    <figure class="shot">
      <button type="button" aria-label="Открыть: Как рулить… ну ладно, пусть тут будет"><img src="assets/img/gallery/how-to-steer.webp" alt="Как рулить… ну ладно, пусть тут будет" width="736" height="871" loading="lazy" decoding="async"></button>
      <figcaption>Как рулить… ну ладно, пусть тут будет</figcaption>
    </figure>
    <figure class="shot">
      <button type="button" aria-label="Открыть: Столетняя война: reference"><img src="assets/img/gallery/hundred-years-war.webp" alt="Столетняя война: reference" width="981" height="968" loading="lazy" decoding="async"></button>
      <figcaption>Столетняя война: reference</figcaption>
    </figure>
  </div>
</main>

<dialog class="lightbox" id="lightbox" aria-label="Просмотр изображения">
  <div class="lightbox__stage"><img id="lb-img" alt=""></div>
  <div class="lightbox__meta"><p id="lb-cap"></p><p class="mono" id="lb-count"></p></div>
  <button class="lb-btn lb-close" type="button" id="lb-close" aria-label="Закрыть" data-icon="close"></button>
  <button class="lb-btn lb-prev" type="button" id="lb-prev" aria-label="Предыдущее" data-icon="left"></button>
  <button class="lb-btn lb-next" type="button" id="lb-next" aria-label="Следующее" data-icon="right"></button>
</dialog>

<footer class="site-footer" id="site-footer"></footer>
</body>
</html>
