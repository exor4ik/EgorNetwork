<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://www.gstatic.com; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; frame-src https://egornetwork-5600d.firebaseapp.com; base-uri 'none'; form-action 'none'; object-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="no-referrer">
<title>Блог — EgorNetwork</title>
<meta name="description" content="Новости студии EgorNetwork и заметки о разработке игр.">
<meta name="theme-color" content="#07080b">
<link rel="icon" href="assets/img/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/site.css">
<script src="assets/js/site.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-app-compat.js" integrity="sha384-Uv5NOxmI4D88FRrXAe7tQNnStDeQK/nnWkSogirw0xr1ZlJhTpk64V2KxKejMfys" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-auth-compat.js" integrity="sha384-P44Lc4FFaOc/XnFQzAIpmmZZpAstRvYwQLiHHU5LHtlBmblzk5gCbsRCe4hJY6IN" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore-compat.js" integrity="sha384-+mJynELdmYgerSPOJua2KFssOXmteKEsil0rhX2Pb8SkqF7j6lHJszb4/K90oC0u" crossorigin="anonymous"></script>
<script src="assets/js/firebase-init.js" defer></script>
<script src="assets/js/blog.js" defer></script>
</head>
<body>
<header class="site-header" id="site-header"></header>

<main id="main" class="wrap">
  <section class="page-head">
    <span class="eyebrow reveal">Блог</span>
    <h1 class="reveal d-1">Новости студии</h1>
    <p class="lead reveal d-2">Блог, который легендарно вернулся. Анонсы, девлоги и всё, что не влезло в Telegram.</p>
  </section>

  <section class="card admin-panel mt-s" id="admin-panel" hidden>
    <h3>Новый пост</h3>
    <form class="stack mt-s" id="post-form" novalidate>
      <div class="field"><label for="post-title">Заголовок</label><input class="input" id="post-title" maxlength="140" required></div>
      <div class="field"><label for="post-text">Текст</label><textarea class="textarea" id="post-text" maxlength="20000" required></textarea></div>
      <div class="btn-row">
        <button class="btn btn--primary" type="submit" id="post-submit">Опубликовать</button>
        <button class="btn btn--ghost" type="button" id="scrub-btn" title="Удалить author/authorUid/reactions из старых постов">Почистить метаданные старых постов</button>
        <button class="btn btn--ghost" type="button" id="logout-btn">Выйти</button>
      </div>
      <p class="status" id="admin-status" role="status"></p>
    </form>
  </section>

  <div class="posts mt-m" id="posts" aria-live="polite">
    <div class="skeleton"></div><div class="skeleton"></div>
  </div>

  <details class="mt-xl" id="admin-login">
    <summary class="hint mono">admin</summary>
    <form class="card stack mt-s" id="login-form" novalidate>
      <div class="field"><label for="login-email">Email</label><input class="input" id="login-email" type="email" autocomplete="username"></div>
      <div class="field"><label for="login-pass">Пароль</label><input class="input" id="login-pass" type="password" autocomplete="current-password"></div>
      <div class="btn-row"><button class="btn btn--sm" type="submit">Войти</button></div>
      <p class="status" id="login-status" role="status"></p>
    </form>
  </details>
</main>

<footer class="site-footer" id="site-footer"></footer>
</body>
</html>
